  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    html, body {
      height: 100%;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif;
      overflow: hidden;
    }
    #container {
      width: 100%;
      height: 100%;
      background:#f3f0eb;
    }
    .page-header {
      position: absolute;
      top: 12px;
      left: 50%;
      transform: translateX(-50%);
      z-index: 1000;
      background: rgba(255,248,235,0.92);
      padding: 8px 18px;
      border-radius: 99px;
      box-shadow: 0 2px 12px rgba(139,90,43,0.18);
    }
    .page-header h1 {
      font-size: 16px;
      color: #8b5a2b;
      font-weight: 600;
      letter-spacing:1px;
    }
    .mask {
      position: absolute;
      inset: 0;
      background: rgba(0,0,0,0.45);
      z-index: 2000;
      display: none;
    }
    .mask.show {
      display: block;
    }
    .person-card {
      position: absolute;
      left: 50%;
      bottom: 12px;
      transform: translateX(-50%);
      width: calc(100% - 24px);
      max-width: 440px;
      max-height: 85vh;
      background: #fff8eb;
      border-radius: 20px;
      z-index: 3000;
      padding: 20px;
      box-shadow: 0 6px 24px rgba(120,70,30,0.22);
      display: none;
      overflow-y: auto;
    }
    .person-card.show {
      display: block;
    }
    .card-close {
      position: absolute;
      right: 14px;
      top:12px;
      font-size:22px;
      color:#997958;
      background: transparent;
      border: none;
      cursor: pointer;
    }
    .card-photo-wrap {
      text-align:center;
      margin-bottom:12px;
    }
    .card-photo {
      width:110px;
      height:110px;
      object-fit:cover;
      border-radius:14px;
      border:3px solid #e8d4bc;
    }
    .card-name {
      text-align:center;
      font-size:18px;
      color:#704824;
      font-weight:bold;
      margin-bottom:4px;
    }
    .card-sub {
      text-align:center;
      font-size:13px;
      color:#94785c;
      margin-bottom:12px;
    }
    .block-title{
      font-size:14px;
      color:#805c38;
      font-weight:600;
      margin:10px 0 6px;
    }
    .card-quote {
      font-size:15px;
      color:#5c442d;
      line-height:1.7;
      padding:12px;
      background:#f7ece0;
      border-radius:12px;
      font-style: italic;
    }
    .card-memoir {
      font-size:14px;
      color:#4b3826;
      line-height:1.75;
      padding:12px;
      background:#fff3e6;
      border-radius:12px;
      white-space: pre-line;
    }
  </style>
</head>
<body>
  <div class="page-header">
    <h1>时光摆渡人 · 城市记忆地图</h1>
  </div>
  <div id="container"></div>
  <div class="mask" id="mask"></div>
  <div class="person-card" id="card">
    <button class="card-close" id="btnClose">×</button>
    <div class="card-photo-wrap">
      <img class="card-photo" id="cardImg" src="" alt="老人照片">
    </div>
    <div class="card-name" id="cardName"></div>
    <div class="card-sub" id="cardSub"></div>

    <div class="block-title">📜时代寄语</div>
    <div class="card-quote" id="cardQuote"></div>

    <div class="block-title">📖个人回忆录</div>
    <div class="card-memoir" id="cardMemoir"></div>
  </div>

const domMask = document.getElementById('mask');
const domCard = document.getElementById('card');
const domCardImg = document.getElementById('cardImg');
const domCardName = document.getElementById('cardName');
const domCardSub = document.getElementById('cardSub');
const domCardQuote = document.getElementById('cardQuote');
const domCardMemoir = document.getElementById('cardMemoir');

let map = null;

window.onload = function () {
  map = L.map('container').setView([45.7612, 126.6234],14);
  L.tileLayer('https://{s}.tile.openstreetmap.de/{z}/{x}/{y}.png', {
    maxZoom:18,
    attribution:'&copy; OpenStreetMap contributors'
  }).addTo(map);

  markerList.forEach(item=>{
    const marker = L.marker([item.lat, item.lng]).addTo(map);
    marker.on('click', ()=>{
      openCard(item);
    })
  })
};

function openCard(person){
  domCardImg.src = person.photoUrl;
  domCardName.innerText = person.name;
  domCardSub.innerText = person.sub;
  domCardQuote.innerText = person.quote;
  domCardMemoir.innerText = person.memoir;

  domMask.classList.add('show');
  domCard.classList.add('show');
  domCard.scrollTop = 0;
}

function closeCard(){
  domMask.classList.remove('show');
  domCard.classList.remove('show');
}

document.getElementById('btnClose').addEventListener('click', closeCard);
domMask.addEventListener('click', closeCard);
</script>
</body>
</html>
